# A generic, single database configuration for Alembic.

[alembic]
# Path to migration scripts
script_location = migrations

# Template used to generate migration file names; The default value is %(rev)s_%(slug)s
file_template = %%(rev)s_%%(slug)s

# Prepend the current working directory to sys.path so app modules can be imported
prepend_sys_path = .

# Timezone to use when generating timestamps in migration files
# timezone = UTC

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a .py file to be detected
# sourceless = false

# Version location specification
version_locations = %(here)s/migrations/versions

# Path separator
path_separator = os

# The database URL is dynamically overridden in migrations/env.py from app.config
# Do NOT store real credentials here.
sqlalchemy.url = postgresql+psycopg2://user:password@localhost/bookrent_db

[post_write_hooks]
# Post write hooks configuration

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
